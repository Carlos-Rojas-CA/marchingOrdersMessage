<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Marching Orders">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B5FFF"/>
      <stop offset="1" stop-color="#0743C0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13.9" fill="url(#tile)"/>
  <!-- Paper plane: the upper wing catches the light, the folded one sits back. -->
  <path d="M56.3 9.6 L5.8 30.1 L28.8 35.2 Z" fill="#ffffff"/>
  <path d="M56.3 9.6 L28.8 35.2 L33.3 57.0 Z" fill="#CFDFFF"/>
  <!-- A trail thinning out behind it, in the amber the app reserves for "now". -->
  <circle cx="19.2" cy="46.1" r="2.9" fill="#FFB020"/>
  <circle cx="12.8" cy="50.6" r="2.2" fill="#FFB020"/>
  <circle cx="7.7" cy="54.4" r="1.5" fill="#FFB020"/>
</svg>
