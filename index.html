<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the document viewer can run edge to edge behind
         the notch, with safe-area insets handled in CSS. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Tints the browser chrome to match whichever palette is in force. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070a0f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Your trip documents, ready offline." />

    <!-- Lets iOS run it as a standalone app from the home screen, which is also
         what exempts its stored data from Safari's 7-day eviction. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marching Orders" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />

    <title>Marching Orders</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
